name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    # Job-level env, inherited by every step below. GitHub Actions does not
    # support YAML anchors, so this is the only way to share it without
    # repeating the block three times and letting the copies drift.
    env:
      # Owner: runs migrations, and the cross-tenant reads the worker does.
      DATABASE_ADMIN_URL: postgres://voltix:voltix@localhost:5432/voltix_test
      # Restricted role: what the app connects as, and the only way an
      # isolation test proves anything — the owner bypasses every policy.
      DATABASE_URL: postgres://voltix_app:voltix_app_dev_password@localhost:5432/voltix_test
      # The integration suites deliberately refuse to inherit the app's
      # connection string — they create and destroy tenants, and pointing that
      # at whatever DATABASE_URL happens to be is how a test run ends up
      # mutating a production database. They read these instead. Here the two
      # are the same throwaway container; in a real environment they are not.
      DATABASE_TEST_URL: postgres://voltix_app:voltix_app_dev_password@localhost:5432/voltix_test
      DATABASE_TEST_ADMIN_URL: postgres://voltix:voltix@localhost:5432/voltix_test
      REDIS_URL: redis://localhost:6379
      AUTH_URL: http://localhost:3000
      STOREFRONT_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: voltix
          POSTGRES_PASSWORD: voltix
          POSTGRES_DB: voltix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltix"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Generated per run rather than hardcoded. A literal 32-char secret in a
      # tracked file is indistinguishable from a real leaked credential to any
      # scanner — gitleaks flagged exactly that here — and the alternative of
      # allowlisting the pattern blunts the scanner for the real thing it is
      # there to catch. A fresh random value per run is both cleaner and a
      # better test: nothing can come to depend on a known secret.
      - name: Generate an ephemeral auth secret
        run: echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      # Without this the integration suites find an empty database, skip
      # themselves, and the run goes green having tested none of the things
      # only a real Postgres can test — RLS, row locking, transactional
      # rollback. A silently-skipped test is worse than a missing one.
      #
      # `db:migrate` also creates the restricted `voltix_app` role the tests
      # connect as, and applies the very RLS policies being asserted.
      - name: Apply migrations and RLS policies
        run: npm run db:migrate

      # The admin read-model tests query the seeded tenant. Without a seed they
      # pass trivially against zero rows.
      - name: Seed the demo catalogue
        run: npm run db:seed

      - name: Unit + integration tests
        run: npm test -- --coverage --reporter=default --reporter=json --outputFile.json=vitest-results.json

      # Proves the integration suites actually executed. They skip themselves
      # when Postgres is unreachable, so a green run is not by itself evidence
      # that anything touched the database — without this, the most valuable
      # tests in the repo could stop running and CI would never say so.
      # Reuses the JSON report from the run above rather than re-running.
      - name: Assert no test was silently skipped
        run: |
          node -e "
            const r = require('./vitest-results.json');
            const total = r.numTotalTests || 0;
            const skipped = r.numPendingTests || 0;
            console.log('ran ' + total + ' tests, ' + skipped + ' skipped');
            if (total === 0) {
              console.log('::error::No tests ran at all.');
              process.exit(1);
            }
            if (skipped > 0) {
              console.log('::error::' + skipped + ' test(s) skipped - the integration suites did not run against Postgres.');
              process.exit(1);
            }
          "

  build:
    name: Build apps
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fails the build on known-exploitable dependencies. `high` rather than
      # `moderate` keeps the signal-to-noise ratio survivable.
      - run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
