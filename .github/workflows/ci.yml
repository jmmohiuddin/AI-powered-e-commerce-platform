name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: voltix
          POSTGRES_PASSWORD: voltix
          POSTGRES_DB: voltix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltix"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test -- --coverage
        env:
          DATABASE_URL: postgres://voltix:voltix@localhost:5432/voltix_test
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: ci-secret-that-is-definitely-long-enough-32
          AUTH_URL: http://localhost:3000
          STOREFRONT_URL: http://localhost:3000
          ADMIN_URL: http://localhost:3001

  build:
    name: Build apps
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fails the build on known-exploitable dependencies. `high` rather than
      # `moderate` keeps the signal-to-noise ratio survivable.
      - run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
