# Production stack for a single Hostinger VPS (or any Docker host).
#
#   caddy      -> TLS termination + routing for storefront / admin / media
#   storefront -> Next.js app on :3000 (internal)
#   admin      -> Next.js app on :3001 (internal)
#   worker     -> background jobs (noon sync, notifications, ...)
#   postgres   -> Postgres 17 + pgvector, data on a named volume
#   redis      -> cache / queues
#   minio      -> S3-compatible media storage, served publicly via Caddy
#
# Run from the repository root on the server:
#   docker compose -f infra/production/docker-compose.prod.yml --env-file .env up -d --build
#
# One-shot migrations (profile "ops" keeps it out of normal `up`):
#   docker compose -f infra/production/docker-compose.prod.yml --env-file .env run --rm migrate
#
# The apps read /app/.env (the monorepo-root .env mounted below) — the same
# single-source-of-configuration contract as development.

name: phoyev-prod

x-app: &app
  build:
    context: ../..
    dockerfile: infra/production/Dockerfile
  image: phoyev-app:latest
  restart: unless-stopped
  env_file: ../../.env
  volumes:
    - ../../.env:/app/.env:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started
  networks: [phoyev]

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3. Caddy advertises h3 via Alt-Svc, so QUIC must actually be
      # reachable — a browser that upgrades and hits a closed UDP port shows
      # "site can't be reached" on the very next request.
      - '443:443/udp'
    environment:
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN:?set in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set in .env}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [storefront, admin]
    networks: [phoyev]

  storefront:
    <<: *app
    command: ['npm', 'run', 'start', '--workspace=@phoyev/storefront']

  admin:
    <<: *app
    command: ['npm', 'run', 'start', '--workspace=@phoyev/admin']

  worker:
    <<: *app
    command: ['npm', 'run', 'worker']

  # One-shot: creates extensions/roles/policies and applies migrations using
  # DATABASE_ADMIN_URL. Not part of `up` — run it explicitly on deploy.
  migrate:
    <<: *app
    restart: 'no'
    profiles: [ops]
    command: ['npm', 'run', 'db:migrate']

  # One-shot: loads packages/commerce/data/semul-catalog.json into the store.
  # Idempotent on SKU, so a re-run after fixing one row imports only that row.
  #
  #   docker compose ... run --rm import-catalog
  #   docker compose ... run --rm import-catalog npm run db:import-catalog -- --dry-run
  #
  # The same service is how the demo catalogue is retired, because it is the
  # one container that has both the scripts and the internal network:
  #
  #   docker compose ... run --rm import-catalog npm run db:remove-demo -- --confirm
  import-catalog:
    <<: *app
    restart: 'no'
    profiles: [ops]
    command: ['npm', 'run', 'db:import-catalog']

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      # Also not renamed, and for a harder reason than the volumes: these two
      # take effect only when initialising an *empty* data directory. The
      # cluster on disk was created with the role and database `voltix`, and the
      # server's DATABASE_URL still authenticates as that role. Changing them
      # here would be ignored by the running database and would then quietly
      # disagree with it — until someone restored from scratch and could not log
      # in. Renaming a Postgres role and database is a migration, not a find and
      # replace.
      POSTGRES_USER: voltix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: voltix
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voltix -d voltix']
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements'
      - '-c'
      - 'pg_stat_statements.track=all'
      - '-c'
      - 'max_connections=200'
    networks: [phoyev]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [phoyev]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set in .env}
    command: server /data
    volumes:
      - minio-data:/data
    networks: [phoyev]

  # Same contract as development: media bucket exists and allows anonymous
  # download before the first upload happens. Idempotent on every up.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS}; do sleep 1; done;
      mc mb --ignore-existing local/${S3_BUCKET:-phoyev-media};
      mc anonymous set download local/${S3_BUCKET:-phoyev-media};
      "
    environment:
      MINIO_USER: ${S3_ACCESS_KEY_ID}
      MINIO_PASS: ${S3_SECRET_ACCESS_KEY}
    networks: [phoyev]

# THE VOLUME NAMES ARE PINNED. DO NOT LET THEM FOLLOW THE PROJECT NAME.
#
# Compose names a volume `<project>_<key>`, so renaming the project from
# `voltix-prod` to `phoyev-prod` would have asked for `phoyev-prod_postgres-data`
# — a volume that does not exist. Docker creates a missing volume silently, so
# the stack would have come up healthy on an empty database: no catalogue, no
# images, no orders, and the real data still sitting in the old volumes with
# nothing pointing at it. The rename is cosmetic; the data is not.
#
# These five names are what the running server actually has on disk. They keep
# the `voltix-prod_` prefix because that is where the bytes are, and renaming a
# volume means copying its contents, not editing this file.
volumes:
  postgres-data:
    name: voltix-prod_postgres-data
  redis-data:
    name: voltix-prod_redis-data
  minio-data:
    name: voltix-prod_minio-data
  # TLS certificates. Recreating this one means re-issuing from Let's Encrypt,
  # which has rate limits a bad afternoon can exhaust.
  caddy-data:
    name: voltix-prod_caddy-data
  caddy-config:
    name: voltix-prod_caddy-config

networks:
  phoyev:
